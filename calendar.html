<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>RPXLABS — Kalender Jadwal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&family=Poppins:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #000000;
            --text: #f0f0f0;
            --muted: #9d9daa;
            --purple: #ffffff;
            --purple-glow: rgba(255, 255, 255, 0.6);
            --line: rgba(255, 255, 255, 0.22);
            --line-strong: rgba(255, 255, 255, 0.45);
            --glass: linear-gradient(160deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.018) 45%, rgba(255,255,255,0.008) 100%);
            --inset: inset 0 1px 0 rgba(255,255,255,0.10);
        }

        html { background: #000000; }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000000;
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
            font-weight: 400;
            min-height: 100vh;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(900px 520px at 12% -12%, rgba(255, 255, 255, 0.08), transparent 62%),
                radial-gradient(760px 460px at 104% 12%, rgba(255, 255, 255, 0.06), transparent 66%),
                radial-gradient(640px 420px at 50% 112%, rgba(255, 255, 255, 0.05), transparent 72%);
        }

        h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1040px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 20px;
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(145%);
            -webkit-backdrop-filter: blur(20px) saturate(145%);
            border: 1px solid var(--line);
            box-shadow:
                var(--inset),
                inset 0 -1px 0 rgba(255, 255, 255, 0.03),
                0 0 46px rgba(255, 255, 255, 0.13),
                0 30px 70px rgba(0, 0, 0, 0.78);
        }

        /* ---------- HEADER ---------- */
        .header {
            text-align: center;
            padding: 1.2rem 0 1.5rem;
            margin-bottom: 1.4rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.18);
        }

        .header .logo {
            display: block;
            width: min(280px, 72%);
            height: auto;
            margin: 0 auto 1rem;
            mix-blend-mode: screen;
            filter: contrast(1.06) brightness(1.04);
        }

        .header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 0.26em;
            margin: 0;
            color: #ffffff;
        }

        /* ---------- PIN GATE ---------- */
        #pinGate {
            padding: 2rem 0 1rem;
            text-align: center;
        }

        #pinGate h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            letter-spacing: 0.02em;
        }

        #pinGate p {
            color: var(--muted);
            font-size: 0.88rem;
            margin-bottom: 1.6rem;
        }

        .pin-row {
            display: flex;
            gap: 0.6rem;
            max-width: 340px;
            margin: 0 auto;
        }

        .pin-row input {
            flex: 1;
            text-align: center;
            letter-spacing: 0.3em;
            font-size: 1.05rem;
            font-weight: 700;
        }

        input, select, textarea {
            font-family: inherit;
            font-size: 0.92rem;
            color: var(--text);
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 0.78rem 0.95rem;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
            width: 100%;
        }

        input:hover, select:hover { border-color: rgba(255, 255, 255, 0.42); }

        input:focus, select:focus {
            border-color: var(--purple);
            background: rgba(255, 255, 255, 0.06);
            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.16),
                0 0 24px rgba(255, 255, 255, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.09);
        }

        .btn {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 0.78rem 1.4rem;
            border-radius: 10px;
            border: 1px solid var(--line-strong);
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.13);
            box-shadow: 0 0 22px rgba(255, 255, 255, 0.25);
            border-color: #ffffff;
        }

        .btn:active { transform: translateY(1px); }

        .btn.ghost {
            background: transparent;
            border-color: rgba(255, 255, 255, 0.2);
            color: var(--muted);
        }

        .btn.ghost:hover { color: #fff; border-color: rgba(255,255,255,0.5); box-shadow: none; }

        /* ---------- HIDDEN ---------- */
        .hidden { display: none !important; }

        /* ---------- TOOLBAR ---------- */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.3rem;
            flex-wrap: wrap;
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .month-nav .nav-btn {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.035);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.05rem;
        }

        .month-nav .nav-btn:hover {
            border-color: #ffffff;
            background: rgba(255,255,255,0.12);
            box-shadow: 0 0 18px rgba(255,255,255,0.22);
        }

        #monthLabel {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            min-width: 190px;
            text-align: center;
        }

        .legend {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.76rem;
            color: var(--muted);
        }

        .legend span { display: flex; align-items: center; gap: 0.35rem; }

        .dot {
            width: 9px; height: 9px; border-radius: 50%;
            display: inline-block;
        }

        .dot.wisuda { background: #ffffff; box-shadow: 0 0 8px rgba(255,255,255,0.7); }
        .dot.other  { background: transparent; border: 1.5px solid rgba(255,255,255,0.75); }

        /* ---------- CALENDAR GRID ---------- */
        .cal-head {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 6px;
        }

        .cal-head div {
            text-align: center;
            font-family: 'Poppins', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 0.4rem 0;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .cell {
            min-height: 92px;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,0.11);
            background: rgba(255,255,255,0.022);
            padding: 0.4rem;
            transition: all 0.18s ease;
            position: relative;
            overflow: hidden;
            cursor: default;
        }

        .cell.empty { background: transparent; border-color: transparent; }

        .cell .dnum {
            font-family: 'Poppins', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            color: rgba(255,255,255,0.55);
            line-height: 1.2;
        }

        .cell .chips {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-top: 4px;
        }

        .chip {
            font-size: 0.62rem;
            line-height: 1.35;
            padding: 2px 5px;
            border-radius: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
        }

        .chip.wisuda {
            background: rgba(255,255,255,0.9);
            color: #000000;
        }

        .chip.other {
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.55);
            color: rgba(255,255,255,0.92);
        }

        .cell.has-job {
            border-color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.035);
            cursor: pointer;
        }

        .cell.has-job:hover {
            border-color: rgba(255,255,255,0.62);
            background: rgba(255,255,255,0.075);
            box-shadow: 0 0 22px rgba(255,255,255,0.16);
            transform: translateY(-1px);
        }

        .cell.today {
            border-color: #ffffff;
            box-shadow: 0 0 16px rgba(255,255,255,0.3);
        }

        .cell.today .dnum { color: #ffffff; }

        .cell.selected {
            border-color: #ffffff;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 1px #ffffff, 0 0 26px rgba(255,255,255,0.28);
        }

        .cell .more {
            font-size: 0.58rem;
            color: var(--muted);
            margin-top: 2px;
            font-weight: 600;
        }

        /* ---------- DETAIL PANEL ---------- */
        #detailPanel {
            margin-top: 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.18);
            padding-top: 1.3rem;
        }

        #detailPanel h3 {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-bottom: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .ev {
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 11px;
            padding: 0.85rem 0.95rem;
            background: rgba(255,255,255,0.03);
            margin-bottom: 0.6rem;
            transition: all 0.18s ease;
        }

        .ev:hover { border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.055); }

        .ev-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.7rem;
            margin-bottom: 0.35rem;
            flex-wrap: wrap;
        }

        .ev-time {
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .badge {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.4);
            color: rgba(255,255,255,0.85);
        }

        .badge.solid { background: #ffffff; color: #000; border-color: #ffffff; }

        .ev-name {
            font-size: 0.88rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }

        .ev-meta {
            font-size: 0.76rem;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .ev-meta span { display: flex; align-items: center; gap: 0.28rem; }

        /* ---------- STATES ---------- */
        .msg {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .msg i { font-size: 1.9rem; display: block; margin-bottom: 0.7rem; color: rgba(255,255,255,0.35); }

        .err {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            padding: 0.8rem 1rem;
            font-size: 0.82rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.55rem;
        }

        /* ---------- STATS ---------- */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.65rem;
            margin-bottom: 1.3rem;
        }

        .stat {
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 10px;
            padding: 0.7rem 0.85rem;
            background: rgba(255,255,255,0.025);
        }

        .stat .k {
            font-size: 0.62rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 700;
            margin-bottom: 0.15rem;
        }

        .stat .v {
            font-family: 'Poppins', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
        }

        /* ---------- FOOTER ---------- */
        .footer {
            text-align: center;
            margin-top: 1.6rem;
            padding-top: 1.1rem;
            border-top: 1px solid rgba(255,255,255,0.14);
            font-size: 0.7rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.32);
        }

        /* ---------- MOBILE ---------- */
        @media (max-width: 760px) {
            body { padding: 10px; }
            .container { padding: 18px 14px; border-radius: 16px; }

            .cal-head { display: none; }

            .cal-grid { grid-template-columns: 1fr; gap: 7px; }

            .cell { min-height: auto; padding: 0.6rem 0.75rem; }
            .cell.empty { display: none; }
            .cell:not(.has-job) { display: none; }

            .cell .dnum {
                font-size: 0.8rem;
                display: inline-block;
                margin-bottom: 0.15rem;
                color: rgba(255,255,255,0.75);
            }

            .cell .chips { margin-top: 3px; }
            .chip { font-size: 0.68rem; white-space: normal; }

            #monthLabel { min-width: 150px; font-size: 0.98rem; }
            .toolbar { justify-content: center; }
            .legend { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="/assets/logo-wisuda.png" alt="RPXLABS" class="logo">
            <h1>Calendar &amp; Schedule</h1>
        </div>

        <!-- GERBANG: tanpa PIN. Hanya butuh token dari portal. -->
        <div id="pinGate">
            <h2 id="gateTitle">Memuat jadwal…</h2>
            <p id="gateNote">Sebentar ya.</p>
        </div>

        <!-- CALENDAR -->
        <div id="calWrap" class="hidden">
            <div class="toolbar">
                <div class="month-nav">
                    <button class="nav-btn" id="prevBtn" title="Bulan sebelumnya"><i class="ph ph-caret-left"></i></button>
                    <div id="monthLabel"></div>
                    <button class="nav-btn" id="nextBtn" title="Bulan berikutnya"><i class="ph ph-caret-right"></i></button>
                </div>
                <div class="legend">
                    <span><i class="dot wisuda"></i>Wisuda</span>
                    <span><i class="dot other"></i>Other Job</span>
                </div>
            </div>

            <div class="stats" id="statsRow"></div>

            <div class="cal-head">
                <div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div><div>Min</div>
            </div>
            <div class="cal-grid" id="calGrid"></div>

            <div id="detailPanel" class="hidden"></div>
        </div>

        <div class="footer">RPXLABS &nbsp;•&nbsp; Chasing Motion, Capturing Emotion</div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx1BYB1TACi2OSYFACowp38RVs1A8tq70hPn3dxbvjtLfJuYsS9LfuNEWQbOx5_o5KnLg/exec';

        /* ============================================================
           TOKEN PORTAL — kalender hanya untuk admin.
           Token dikirim portal lewat #t=... di URL.
           ============================================================ */
        const K_TOKEN = 'rpxlabs_portal_token';
        const K_TIME  = 'rpxlabs_portal_time';
        const PORTAL_URL = 'https://rpxlabs-web.vercel.app/portal.html';

        (function readPortalToken(){
            const m = /(?:^|[#&])t=([A-Za-z0-9]+)/.exec(location.hash || '');
            if (m) {
                localStorage.setItem(K_TOKEN, m[1]);
                localStorage.setItem(K_TIME, String(Date.now()));
                try { history.replaceState(null, '', location.pathname); } catch (e) {}
            }
        })();

        var portalToken = localStorage.getItem(K_TOKEN) || '';

        const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
        const DAYNAMES = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

        let currentYear, currentMonth;
        let calData = null;
        let selectedDate = null;
        let savedPin = '';

        const pinGate = document.getElementById('pinGate');
        const calWrap = document.getElementById('calWrap');
        const monthLabel = document.getElementById('monthLabel');
        const calGrid = document.getElementById('calGrid');
        const statsRow = document.getElementById('statsRow');
        const detailPanel = document.getElementById('detailPanel');

        const pad = n => String(n).padStart(2, '0');

        function isoDate(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }

        function todayISO() {
            const n = new Date();
            return isoDate(n.getFullYear(), n.getMonth() + 1, n.getDate());
        }

        async function loadMonth(year, month, pin) {
            try {
                const url = GOOGLE_SCRIPT_URL + '?action=getCalendarMonth&year=' + year + '&month=' + month + '&token=' + encodeURIComponent(pin);
                const res = await fetch(url);
                const data = await res.json();

                if (!data.success) {
                    if (data.error === 'PIN_SALAH') return false;
                    throw new Error(data.error || 'Gagal memuat');
                }

                calData = data;
                currentYear = data.year;
                currentMonth = data.month;
                render();
                return true;
            } catch (e) {
                console.error(e);
                showMsg('Gagal memuat jadwal. Periksa koneksi lalu coba lagi.');
                return false;
            }
        }

        function showMsg(text) {
            calGrid.innerHTML = '<div class="msg" style="grid-column:1/-1;"><i class="ph ph-wifi-slash"></i>' + text + '</div>';
        }

        function render() {
            monthLabel.textContent = MONTHS[currentMonth - 1] + ' ' + currentYear;

            const days = calData.days || {};
            const summary = calData.summary || {};

            // Stats
            let totalJobs = 0, totalWisuda = 0, totalOther = 0, busyDays = 0;
            Object.keys(summary).forEach(d => {
                totalJobs += summary[d].count;
                totalWisuda += summary[d].wisuda;
                totalOther += summary[d].other;
                if (summary[d].count > 0) busyDays++;
            });

            statsRow.innerHTML =
                '<div class="stat"><div class="k">Total Job</div><div class="v">' + totalJobs + '</div></div>' +
                '<div class="stat"><div class="k">Wisuda</div><div class="v">' + totalWisuda + '</div></div>' +
                '<div class="stat"><div class="k">Other Job</div><div class="v">' + totalOther + '</div></div>' +
                '<div class="stat"><div class="k">Hari Terisi</div><div class="v">' + busyDays + '</div></div>';

            // Grid: Monday-first offset
            const firstDow = new Date(currentYear, currentMonth - 1, 1).getDay(); // 0=Sun
            const offset = (firstDow + 6) % 7;
            const lastDate = new Date(currentYear, currentMonth, 0).getDate();
            const today = todayISO();

            let html = '';
            for (let i = 0; i < offset; i++) html += '<div class="cell empty"></div>';

            for (let d = 1; d <= lastDate; d++) {
                const iso = isoDate(currentYear, currentMonth, d);
                const list = days[iso] || [];
                const has = list.length > 0;

                let cls = 'cell';
                if (has) cls += ' has-job';
                if (iso === today) cls += ' today';
                if (iso === selectedDate) cls += ' selected';

                let chips = '';
                list.slice(0, 2).forEach(ev => {
                    const kindCls = ev.kind === 'WISUDA' ? 'wisuda' : 'other';
                    chips += '<div class="chip ' + kindCls + '">' + ev.start + ' ' + ev.subType + '</div>';
                });
                if (list.length > 2) chips += '<div class="more">+' + (list.length - 2) + ' lagi</div>';

                const onclick = has ? ' onclick="pickDate(\'' + iso + '\')"' : '';
                html += '<div class="' + cls + '"' + onclick + '>' +
                            '<div class="dnum" data-day="' + d + '">' + d + '</div>' +
                            (chips ? '<div class="chips">' + chips + '</div>' : '') +
                        '</div>';
            }

            calGrid.innerHTML = html;

            if (selectedDate && days[selectedDate]) renderDetail(selectedDate);
            else detailPanel.classList.add('hidden');
        }

        function pickDate(iso) {
            selectedDate = iso;
            render();
            renderDetail(iso);
        }

        function renderDetail(iso) {
            const list = (calData.days || {})[iso] || [];
            if (!list.length) { detailPanel.classList.add('hidden'); return; }

            const parts = iso.split('-');
            const dt = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            const title = DAYNAMES[dt.getDay()] + ', ' + parseInt(parts[2]) + ' ' + MONTHS[parseInt(parts[1]) - 1] + ' ' + parts[0];

            let html = '<h3><i class="ph ph-calendar-check"></i>' + title + '</h3>';

            list.forEach(ev => {
                const isW = ev.kind === 'WISUDA';
                const badge = isW ? '<span class="badge solid">Wisuda</span>' : '<span class="badge">' + (ev.jenis || 'Other') + '</span>';

                let meta = '';
                if (ev.subType) meta += '<span><i class="ph ph-package"></i>' + ev.subType + '</span>';
                if (ev.lokasi) meta += '<span><i class="ph ph-map-pin"></i>' + ev.lokasi + '</span>';
                if (ev.universitas) meta += '<span><i class="ph ph-graduation-cap"></i>' + ev.universitas + '</span>';

                html += '<div class="ev">' +
                            '<div class="ev-top">' +
                                '<div class="ev-time"><i class="ph ph-clock"></i>' + ev.start + ' – ' + ev.end + '</div>' +
                                badge +
                            '</div>' +
                            '<div class="ev-name">' + (ev.nama || ev.detail || 'Job') + '</div>' +
                            '<div class="ev-meta">' + meta + '</div>' +
                        '</div>';
            });

            detailPanel.innerHTML = html;
            detailPanel.classList.remove('hidden');
        }

        /* Auto-unlock: kalender tanpa PIN. Hanya butuh token dari portal. */
        (async function autoUnlock(){
            if (!portalToken) {
                document.body.innerHTML = `
                  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0a0a0a;color:#f0f0f0;font-family:Nunito,sans-serif;text-align:center">
                    <div style="max-width:360px">
                      <div style="font-size:2rem;opacity:.5;margin-bottom:16px"><i class="ph ph-lock-key"></i></div>
                      <h1 style="font-size:1.3rem;font-weight:700;margin-bottom:10px">Halaman Terkunci</h1>
                      <p style="font-size:.85rem;color:#7c7c8a;line-height:1.6;margin-bottom:22px">Masuk lewat portal dulu supaya kalender bisa dibuka.</p>
                      <a href="${PORTAL_URL}" style="display:inline-block;background:#f0f0f0;color:#000;font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border-radius:11px;padding:13px 22px">Buka Portal</a>
                    </div>
                  </div>`;
                return;
            }
            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth() + 1;
            const ok = await loadMonth(currentYear, currentMonth, portalToken);
            if (ok) {
                savedPin = portalToken;
                pinGate.classList.add('hidden');
                calWrap.classList.remove('hidden');
                return;
            }
            // Token kedaluwarsa / server belum update: arahkan balik ke portal
            localStorage.removeItem(K_TOKEN);
            localStorage.removeItem(K_TIME);
            document.getElementById('gateTitle').innerHTML = '<i class="ph ph-lock-key"></i> Sesi Habis';
            document.getElementById('gateNote').innerHTML =
              'Buka portal dulu untuk memperbarui akses.<br><br>' +
              '<a href="' + PORTAL_URL + '" style="display:inline-block;background:#f0f0f0;color:#000;font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border-radius:11px;padding:12px 22px;margin-top:6px">Buka Portal</a>';
        })();

        document.getElementById('prevBtn').addEventListener('click', async () => {
            let m = currentMonth - 1, y = currentYear;
            if (m < 1) { m = 12; y--; }
            selectedDate = null;
            await loadMonth(y, m, savedPin);
        });

        document.getElementById('nextBtn').addEventListener('click', async () => {
            let m = currentMonth + 1, y = currentYear;
            if (m > 12) { m = 1; y++; }
            selectedDate = null;
            await loadMonth(y, m, savedPin);
        });
    </script>
</body>
</html>
