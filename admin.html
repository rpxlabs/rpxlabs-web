<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>RPXLABS — Schedule &amp; Job Input</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #000000;
        --text: #f0f0f0;
        --muted: #9d9daa;
        --dim: #7c7c8a;
        --accent: #ffffff;
        --line: rgba(255, 255, 255, 0.22);
        --line-strong: rgba(255, 255, 255, 0.45);
        --glass: linear-gradient(160deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.018) 45%, rgba(255,255,255,0.008) 100%);
        --inset: inset 0 1px 0 rgba(255, 255, 255, 0.10);
    }

    html { background: #000; }

    body {
        font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #000;
        color: var(--text);
        line-height: 1.6;
        padding: 16px;
        min-height: 100vh;
        position: relative;
        -webkit-font-smoothing: antialiased;
    }

    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
            radial-gradient(900px 520px at 12% -12%, rgba(255,255,255,0.08), transparent 62%),
            radial-gradient(760px 460px at 104% 12%, rgba(255,255,255,0.06), transparent 66%),
            radial-gradient(640px 420px at 50% 112%, rgba(255,255,255,0.05), transparent 72%);
    }

    h1, h2, h3 { font-family: 'Poppins', sans-serif; }

    .container {
        position: relative;
        z-index: 1;
        max-width: 780px;
        margin: 0 auto;
        padding: 30px 26px 40px;
        border-radius: 20px;
        background: var(--glass);
        backdrop-filter: blur(20px) saturate(145%);
        -webkit-backdrop-filter: blur(20px) saturate(145%);
        border: 1px solid var(--line);
        box-shadow: var(--inset), inset 0 -1px 0 rgba(255,255,255,0.03),
                    0 0 46px rgba(255,255,255,0.13), 0 30px 70px rgba(0,0,0,0.78);
    }

    /* ---------- HEADER ---------- */
    .header {
        text-align: center;
        padding: 0.3rem 0 1.5rem;
        margin-bottom: 1.4rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.18);
        position: relative;
    }

    .header .logo {
        display: block;
        width: min(240px, 68%);
        height: auto;
        margin: 0 auto 0.9rem;
        mix-blend-mode: screen;
        filter: contrast(1.06) brightness(1.04);
    }

    .header h1 {
        font-family: 'Poppins', sans-serif;
        font-size: 0.86rem;
        font-weight: 600;
        font-style: italic;
        text-transform: uppercase;
        letter-spacing: 0.26em;
        margin: 0;
        color: #ffffff;
    }
    .live-pill {
        position: absolute;
        top: 0;
        right: 0;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.63rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 700;
        color: rgba(255,255,255,0.92);
        border: 1px solid rgba(255,255,255,0.34);
        background: rgba(255,255,255,0.06);
        padding: 0.32rem 0.7rem;
        border-radius: 999px;
        white-space: nowrap;
    }
    .live-dot {
        width: 5px; height: 5px; border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 0 8px rgba(255,255,255,0.9);
        animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* ---------- PANELS ---------- */
    .panel {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(255,255,255,0.025);
        padding: 1.15rem 1.2rem;
        margin-bottom: 1.5rem;
    }
    .panel-head {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin-bottom: 1rem;
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-weight: 700;
        color: rgba(255,255,255,0.62);
    }
    .panel-head ph-icon { font-size: 1rem; color: #fff; }
    .panel-head .count {
        margin-left: auto;
        font-size: 0.66rem;
        letter-spacing: 0.1em;
        color: var(--dim);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.1rem 0.55rem;
    }

    /* ---------- TODAY TIMELINE ---------- */
    .tl-item {
        display: flex;
        gap: 0.9rem;
        padding: 0.75rem 0;
        border-top: 1px solid rgba(255,255,255,0.07);
    }
    .tl-item:first-child { border-top: none; padding-top: 0.2rem; }
    .tl-time {
        flex: 0 0 92px;
        font-variant-numeric: tabular-nums;
        font-size: 0.8rem;
        font-weight: 700;
        color: #fff;
        letter-spacing: 0.03em;
        padding-top: 1px;
    }
    .tl-time small { display: block; font-size: 0.66rem; font-weight: 500; color: var(--dim); letter-spacing: 0.06em; }
    .tl-body { flex: 1; min-width: 0; }
    .tl-title {
        font-size: 0.9rem;
        font-weight: 600;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex-wrap: wrap;
    }
    .tl-meta { font-size: 0.76rem; color: var(--muted); margin-top: 0.15rem; }
    .badge-kind {
        font-size: 0.58rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 800;
        padding: 0.14rem 0.45rem;
        border-radius: 4px;
        border: 1px solid currentColor;
        opacity: 0.9;
    }
    .k-wisuda { color: #ffffff; }
    .k-sport  { color: rgba(255,255,255,0.88); }
    .k-event  { color: rgba(255,255,255,0.66); }
    .k-doc    { color: rgba(255,255,255,0.48); }

    .clash {
        margin-top: 0.5rem;
        font-size: 0.72rem;
        font-weight: 600;
        color: #ff8b80;
        display: flex;
        align-items: center;
        gap: 0.35rem;
    }

    .empty {
        font-size: 0.82rem;
        color: var(--dim);
        text-align: center;
        padding: 0.9rem 0;
    }

    /* ---------- STATS ---------- */
    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.65rem;
        margin-bottom: 1.5rem;
    }
    .stat {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0.85rem 0.7rem;
        background: rgba(255,255,255,0.022);
        text-align: center;
    }
    .stat-val {
        font-family: 'Poppins', sans-serif;
        font-size: 1.35rem;
        font-weight: 600;
        color: #fff;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
    }
    .stat-lbl {
        font-size: 0.58rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
        font-weight: 700;
        margin-top: 0.35rem;
    }

    /* ---------- FORM ---------- */
    form { margin-bottom: 1.9rem; }
    h2 {
        font-size: 0.82rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 700;
        color: rgba(255,255,255,0.72);
        margin-bottom: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.45rem;
    }
    h2 ph-icon { color: #fff; font-size: 0.95rem; }

    .pills {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.4rem;
        margin-bottom: 1.1rem;
        padding: 0.3rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255,255,255,0.02);
    }
    .pill {
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        font-family: inherit;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 0.55rem 0.3rem;
        border-radius: 9px;
        cursor: pointer;
        transition: all 0.18s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.3rem;
    }
    .pill ph-icon { font-size: 0.95rem; }
    .pill:hover { color: #fff; }
    .pill.active {
        background: rgba(255,255,255,0.09);
        border-color: rgba(255,255,255,0.28);
        color: #fff;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.14);
    }
    .pill.active.sport { color: #ffffff; border-color: rgba(255,255,255,0.42); background: rgba(255,255,255,0.09); }

    .form-group { margin-bottom: 1rem; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
    .row3 { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 0.7rem; }

    label {
        display: block;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
        margin-bottom: 0.42rem;
    }
    label .req { color: rgba(255,255,255,0.9); }

    input, select, textarea {
        width: 100%;
        background: rgba(0,0,0,0.45);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.68rem 0.8rem;
        color: var(--text);
        font-family: inherit;
        font-size: 0.86rem;
        font-weight: 500;
        transition: border-color 0.16s, box-shadow 0.16s;
        appearance: none;
        -webkit-appearance: none;
    }
    input::placeholder, textarea::placeholder { color: #5a5a66; }
    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: rgba(255,255,255,0.55);
        box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
    }
    select {
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239d9daa' stroke-width='2'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 0.65rem center;
        background-size: 16px;
        padding-right: 2rem;
    }
    select option { background: #0a0a0a; color: #f0f0f0; }
    textarea { resize: vertical; min-height: 64px; }

    input[type="date"], input[type="time"] { color-scheme: dark; }

    /* ---------- CONFLICT BOX ---------- */
    #conflictBox { margin: 0 0 1rem; }

    .cbox {
        display: flex;
        gap: 0.6rem;
        padding: 0.75rem 0.85rem;
        border-radius: 10px;
        font-size: 0.78rem;
        line-height: 1.5;
        border: 1px solid;
        align-items: flex-start;
    }
    .cbox ph-icon { font-size: 1.05rem; flex-shrink: 0; margin-top: 0.08rem; }
    .cbox strong { display: block; font-weight: 700; margin-bottom: 0.15rem; }
    .cbox-ok { border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.055); color: rgba(255,255,255,0.85); }
    .cbox-warn { border-color: rgba(255,139,128,0.38); background: rgba(255,139,128,0.07); color: #ff9d94; }
    .cbox-info { border-color: var(--line); background: rgba(255,255,255,0.03); color: var(--muted); }
    .cbox ul { margin: 0.3rem 0 0 1rem; font-size: 0.74rem; }

    /* ---------- BUTTON ---------- */
    .btn {
        width: 100%;
        border: 1px solid rgba(255,255,255,0.32);
        background: linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
        color: #fff;
        font-family: 'Poppins', sans-serif;
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 0.95rem 1rem;
        border-radius: 11px;
        cursor: pointer;
        transition: all 0.18s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.14);
    }
    .btn:hover:not(:disabled) { background: linear-gradient(160deg, rgba(255,255,255,0.2), rgba(255,255,255,0.08)); border-color: rgba(255,255,255,0.5); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ---------- AGENDA ---------- */
    .day-group { margin-bottom: 1.1rem; }
    .day-group:last-child { margin-bottom: 0; }
    .day-head {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin-bottom: 0.45rem;
    }
    .day-date {
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #fff;
    }
    .day-label { font-size: 0.68rem; color: var(--dim); letter-spacing: 0.06em; }
    .day-line { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0.14), transparent); }
    .ev {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        padding: 0.55rem 0.7rem;
        border-radius: 9px;
        background: rgba(255,255,255,0.022);
        border-left: 2px solid var(--line-strong);
        margin-bottom: 0.35rem;
    }
    .ev.wisuda { border-left-color: #ffffff; }
    .ev.sport { border-left-color: rgba(255,255,255,0.75); }
    .ev.event { border-left-color: rgba(255,255,255,0.6); }
    .ev.doc { border-left-color: rgba(255,255,255,0.42); }
    .ev-time {
        font-size: 0.72rem;
        font-weight: 700;
        color: #fff;
        font-variant-numeric: tabular-nums;
        flex: 0 0 auto;
        min-width: 80px;
    }
    .ev-name { font-size: 0.8rem; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ev-name span { color: var(--dim); font-size: 0.72rem; }

    .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(120%);
        z-index: 50;
        background: #101010;
        border: 1px solid var(--line-strong);
        color: #fff;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.75rem 1.1rem;
        border-radius: 11px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.8);
        transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
        max-width: 90vw;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 520px) {
        body { padding: 10px; }
        .container { padding: 20px 15px 32px; border-radius: 16px; }
        .row3 { grid-template-columns: 1fr 1fr; }
        .row3 .span-full { grid-column: 1 / -1; }
        .tl-time { flex-basis: 74px; font-size: 0.74rem; }
        .stat-val { font-size: 1.15rem; }
        .ev-time { min-width: 68px; font-size: 0.68rem; }
        .live-pill { position: static; margin: 0 auto 0.7rem; display: inline-flex; }
    }
</style>
</head>
<body>
<div class="container">

    <div class="header">
        <div class="live-pill"><span class="live-dot"></span>Live</div>
        <img src="/assets/logo-wisuda.png" alt="RPXLABS" class="logo">
        <h1>Schedule &amp; Job Input</h1>
    </div>

    <!-- TODAY -->
    <div class="panel">
        <div class="panel-head">
            <ph-icon class="ph ph-calendar-dots"></ph-icon>
            Jadwal Hari Ini
            <span class="count" id="todayCount">—</span>
        </div>
        <div id="todayList"><div class="empty">Memuat…</div></div>
    </div>

    <!-- STATS -->
    <div class="stats">
        <div class="stat">
            <div class="stat-val" id="statJobs">—</div>
            <div class="stat-lbl">Job 7 Hari</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="statDays">—</div>
            <div class="stat-lbl">Hari Sibuk</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="statClash">—</div>
            <div class="stat-lbl">Tabrakan</div>
        </div>
    </div>

    <!-- FORM -->
    <form id="jobForm">
        <h2><ph-icon class="ph ph-plus-square"></ph-icon>Input Job Baru</h2>

        <label>Sesi</label>
        <div class="pills" id="pills">
            <button type="button" class="pill active sport" data-jenis="Sport">
                <ph-icon class="ph ph-tennis-ball"></ph-icon>Sport
            </button>
            <button type="button" class="pill" data-jenis="Event">
                <ph-icon class="ph ph-confetti"></ph-icon>Event
            </button>
            <button type="button" class="pill" data-jenis="Documentation">
                <ph-icon class="ph ph-camera"></ph-icon>Doc
            </button>
        </div>

        <div class="form-group">
            <label id="subTypeLabel">Sub-Type <span class="req">*</span></label>
            <select id="subType" required></select>
        </div>

        <div class="form-group">
            <label>Detail Job <span class="req">*</span></label>
            <input type="text" id="detail" required placeholder="Nama klien / judul acara">
        </div>

        <div class="form-group">
            <label>Lokasi <span class="req">*</span></label>
            <input type="text" id="lokasi" required placeholder="Lapangan / gedung / venue">
        </div>

        <div class="form-group">
            <label>Tanggal &amp; Jam <span class="req">*</span></label>
            <div class="row3">
                <input type="date" id="tanggal" required>
                <input type="time" id="jamStart" required value="08:00">
                <input type="time" id="jamEnd" required value="10:00">
            </div>
        </div>

        <div id="conflictBox"></div>

        <div class="panel" style="border-color: rgba(255,255,255,0.24); background: rgba(255,255,255,0.04); margin: 1.1rem 0;">
            <div class="panel-head">
                <ph-icon class="ph ph-currency-circle-dollar"></ph-icon>Harga &amp; DP
            </div>
            <div class="form-group" style="margin-bottom: 0.7rem;">
                <label>Harga Total <span class="req">*</span></label>
                <input type="number" id="hargaTotal" placeholder="0" min="0" step="1000">
                <div id="hargaTotalFmt" style="font-size: 0.74rem; color: var(--dim); margin-top: 0.35rem;">Rp 0</div>
            </div>
            <div class="row2 form-group" style="margin-bottom: 0;">
                <div>
                    <label>DP (opsional)</label>
                    <input type="number" id="dp" placeholder="Kosongkan jika belum ada" min="0" step="1000">
                    <div id="dpFmt" style="font-size: 0.74rem; color: var(--dim); margin-top: 0.35rem;">Rp 0</div>
                </div>
                <div>
                    <label>Sisa Bayar</label>
                    <input type="text" id="sisaBayar" readonly style="background: rgba(0,0,0,0.65); cursor: default;">
                    <div id="sisaBayarFmt" style="font-size: 0.74rem; color: var(--dim); margin-top: 0.35rem;">Rp 0</div>
                </div>
            </div>
        </div>

        <div class="row2 form-group">
            <div>
                <label>Status</label>
                <select id="status">
                    <option value="BOOKED">Booked</option>
                    <option value="DONE">Done</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>
            </div>
            <div>
                <label>Catatan</label>
                <input type="text" id="catatan" placeholder="opsional">
            </div>
        </div>

        <button type="submit" class="btn" id="submitBtn">
            <ph-icon class="ph ph-check-square"></ph-icon>Simpan Job
        </button>
    </form>

    <!-- AGENDA -->
    <div class="panel">
        <div class="panel-head">
            <ph-icon class="ph ph-list-checks"></ph-icon>
            Agenda 14 Hari
            <span class="count" id="agendaCount">—</span>
        </div>
        <div id="agendaList"><div class="empty">Memuat…</div></div>
    </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   KONFIGURASI
   ============================================================ */
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx1BYB1TACi2OSYFACowp38RVs1A8tq70hPn3dxbvjtLfJuYsS9LfuNEWQbOx5_o5KnLg/exec';

/* ============================================================
   TOKEN PORTAL — halaman ini hanya untuk admin.
   Token didapat dari portal.html, dikirim lewat #t=... di URL.
   ============================================================ */
const K_TOKEN = 'rpxlabs_portal_token';
const K_TIME  = 'rpxlabs_portal_time';
const PORTAL_URL = '/portal.html';

(function readPortalToken(){
    const m = /(?:^|[#&])t=([A-Za-z0-9]+)/.exec(location.hash || '');
    if (m) {
        localStorage.setItem(K_TOKEN, m[1]);
        localStorage.setItem(K_TIME, String(Date.now()));
        try { history.replaceState(null, '', location.pathname); } catch (e) {}
    }
})();

var PORTAL_TOKEN = localStorage.getItem(K_TOKEN) || '';

/* Kunci halaman kalau tidak ada token */
function lockPage(){
    document.body.innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#000;color:#f0f0f0;font-family:Nunito,sans-serif;text-align:center">
        <div style="max-width:360px">
          <div style="font-size:2rem;opacity:.5;margin-bottom:16px"><ph-icon class="ph ph-lock-key"></ph-icon></div>
          <h1 style="font-size:1.3rem;font-weight:700;margin-bottom:10px">Halaman Terkunci</h1>
          <p style="font-size:.85rem;color:#7c7c8a;line-height:1.6;margin-bottom:22px">Masuk lewat portal dulu supaya halaman ini bisa dibuka.</p>
          <a href="${PORTAL_URL}" style="display:inline-block;background:#f0f0f0;color:#000;font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border-radius:11px;padding:13px 22px">Buka Portal</a>
        </div>
      </div>`;
}

if (!PORTAL_TOKEN) {
    lockPage();
} else {
    fetch(GOOGLE_SCRIPT_URL + '?action=verifyToken&token=' + encodeURIComponent(PORTAL_TOKEN))
      .then(r => r.json())
      .then(d => { if (!d || !d.success) lockPage(); })
      .catch(() => { /* offline: biarkan, server tetap menolak tanpa token valid */ });
}

const SUBTYPES = {
    'Sport': ['Padel', 'Lari', 'Tenis', 'Basket', 'Futsal', 'Badminton'],
    'Event': ['Akad Nikah', 'Birthday Party', 'Corporate Event', 'Seminar', 'Gathering'],
    'Documentation': ['Product', 'Portrait', 'BTS', 'Prewedding', 'Wedding', 'Content']
};

let currentJenis = 'Sport';
let allEvents = [];

/* ---------- helpers ---------- */
const el = id => document.getElementById(id);

function todayISO() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function addDays(iso, n) {
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(y, m - 1, d + n);
    return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}
function fmtDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
}
function fmtDateLong(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function toMin(hhmm) {
    const p = String(hhmm || '0:0').split(':').map(Number);
    return (p[0] || 0) * 60 + (p[1] || 0);
}
function rupiah(n) {
    if (!n) return '';
    return 'Rp ' + Number(n).toLocaleString('id-ID');
}
function kindClass(ev) {
    if (ev.kind === 'WISUDA') return 'wisuda';
    const j = (ev.jenis || '').toLowerCase();
    if (j.startsWith('sport')) return 'sport';
    if (j.startsWith('event')) return 'event';
    return 'doc';
}
function kindTag(ev) {
    if (ev.kind === 'WISUDA') return 'Wisuda';
    return ev.subType || ev.jenis || 'Job';
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, icon) {
    const t = el('toast');
    t.innerHTML = '<ph-icon class="ph ' + (icon || 'ph-info') + '"></ph-icon>' + msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3800);
}

/* ---------- detect clashes dalam satu hari ---------- */
function findClashes(events) {
    const clashes = [];
    const byDate = {};
    events.forEach(ev => {
        (byDate[ev.date] = byDate[ev.date] || []).push(ev);
    });
    Object.entries(byDate).forEach(([date, list]) => {
        const sorted = list.slice().sort((a, b) => toMin(a.start) - toMin(b.start));
        for (let i = 1; i < sorted.length; i++) {
            const prev = sorted[i - 1];
            const cur = sorted[i];
            if (toMin(cur.start) < toMin(prev.end)) {
                clashes.push({ date, a: prev, b: cur });
            }
        }
    });
    return clashes;
}

/* ---------- render: hari ini ---------- */
function renderToday() {
    const today = todayISO();
    const list = allEvents.filter(e => e.date === today);
    el('todayCount').textContent = list.length + ' job';

    if (!list.length) {
        el('todayList').innerHTML = '<div class="empty">Tidak ada job hari ini</div>';
        return;
    }

    const clashes = findClashes(list);
    el('todayList').innerHTML = list.map(ev => {
        const clash = clashes.find(c => c.a === ev || c.b === ev);
        const dur = (toMin(ev.end) - toMin(ev.start)) / 60;
        return `
        <div class="tl-item">
            <div class="tl-time">
                ${ev.start}
                <small>${ev.end} · ${dur % 1 === 0 ? dur : dur.toFixed(1)}j</small>
            </div>
            <div class="tl-body">
                <div class="tl-title">
                    <span class="badge-kind k-${kindClass(ev)}">${kindTag(ev)}</span>
                    ${ev.detail || ev.nama || '—'}
                </div>
                <div class="tl-meta">${ev.lokasi || 'Lokasi belum diisi'}</div>
                ${clash ? '<div class="clash"><ph-icon class="ph ph-warning"></ph-icon>Tabrakan jadwal — cek ulang jam</div>' : ''}
            </div>
        </div>`;
    }).join('');
}

/* ---------- render: stats ---------- */
function renderStats() {
    const today = todayISO();
    const limit = addDays(today, 7);
    const week = allEvents.filter(e => e.date >= today && e.date <= limit);
    const days = new Set(week.map(e => e.date));
    const clashes = findClashes(allEvents.filter(e => e.date >= today));

    el('statJobs').textContent = week.length;
    el('statDays').textContent = days.size;
    el('statClash').textContent = clashes.length;
    el('statClash').style.color = clashes.length ? '#ff8b80' : '#fff';
}

/* ---------- render: agenda 14 hari ---------- */
function renderAgenda() {
    const today = todayISO();
    const limit = addDays(today, 14);
    const list = allEvents.filter(e => e.date >= today && e.date <= limit);
    el('agendaCount').textContent = list.length + ' job';

    if (!list.length) {
        el('agendaList').innerHTML = '<div class="empty">Belum ada jadwal 14 hari ke depan</div>';
        return;
    }

    const groups = {};
    list.forEach(ev => (groups[ev.date] = groups[ev.date] || []).push(ev));

    el('agendaList').innerHTML = Object.entries(groups).map(([date, evs]) => `
        <div class="day-group">
            <div class="day-head">
                <span class="day-date">${fmtDate(date)}</span>
                <span class="day-label">${evs.length} job</span>
                <span class="day-line"></span>
            </div>
            ${evs.map(ev => `
                <div class="ev ${kindClass(ev)}">
                    <span class="ev-time">${ev.start}–${ev.end}</span>
                    <span class="ev-name">${ev.detail || ev.nama || '—'} <span>· ${kindTag(ev)}${ev.lokasi ? ' · ' + ev.lokasi : ''}</span></span>
                </div>
            `).join('')}
        </div>
    `).join('');
}

/* ---------- load ---------- */
async function loadSchedule() {
    try {
        const from = todayISO();
        const to = addDays(from, 30);
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getSchedule&from=${from}&to=${to}&token=${encodeURIComponent(localStorage.getItem('rpxlabs_portal_token')||'')}`, { cache: 'no-store' });
        const data = await res.json();

        if (!data.success) throw new Error(data.error || 'Gagal memuat jadwal');

        allEvents = data.events || [];
        renderToday();
        renderStats();
        renderAgenda();
    } catch (err) {
        console.error(err);
        el('todayList').innerHTML = '<div class="empty">Gagal memuat jadwal. Cek koneksi / Apps Script.</div>';
        el('agendaList').innerHTML = '<div class="empty">—</div>';
    }
}

/* ---------- pills ---------- */
function setJenis(jenis) {
    currentJenis = jenis;
    document.querySelectorAll('.pill').forEach(p => {
        p.classList.toggle('active', p.dataset.jenis === jenis);
        p.classList.toggle('sport', p.dataset.jenis === jenis && jenis === 'Sport');
    });
    const options = SUBTYPES[jenis] || [];
    el('subType').innerHTML = options.map(o => `<option value="${o}">${o}</option>`).join('');
    el('subTypeLabel').innerHTML = 'Sub-Type <span class="req">*</span>';
}

document.querySelectorAll('.pill').forEach(p => {
    p.addEventListener('click', () => setJenis(p.dataset.jenis));
});

/* ---------- kalkulator harga ---------- */
function updatePriceDisplay() {
    const total = Number(el('hargaTotal').value) || 0;
    let dpVal = Number(el('dp').value) || 0;
    if (dpVal > total) {
        dpVal = total;
        el('dp').value = total;
    }
    const sisa = Math.max(0, total - dpVal);

    el('hargaTotalFmt').textContent = rupiah(total);
    el('dpFmt').textContent = rupiah(dpVal);
    el('sisaBayarFmt').textContent = rupiah(sisa);
    el('sisaBayar').value = String(sisa);
}

el('hargaTotal').addEventListener('input', updatePriceDisplay);

el('dp').addEventListener('input', updatePriceDisplay);

/* ---------- conflict check ---------- */
let conflictTimer;
function scheduleConflictCheck() {
    clearTimeout(conflictTimer);
    conflictTimer = setTimeout(checkConflictNow, 420);
}

async function checkConflictNow() {
    const date = el('tanggal').value;
    const start = el('jamStart').value;
    const end = el('jamEnd').value;
    const box = el('conflictBox');

    if (!date || !start || !end) { box.innerHTML = ''; return; }
    if (toMin(end) <= toMin(start)) {
        box.innerHTML = `<div class="cbox cbox-warn"><ph-icon class="ph ph-warning"></ph-icon><div><strong>Jam tidak valid</strong>Jam selesai harus setelah jam mulai.</div></div>`;
        return;
    }

    box.innerHTML = `<div class="cbox cbox-info"><ph-icon class="ph ph-circle-notch"></ph-icon><div>Mengecek jadwal…</div></div>`;

    try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=checkConflict&date=${date}&start=${start}&end=${end}`, { cache: 'no-store' });
        const data = await res.json();

        if (data.hasConflict) {
            const items = data.conflicts.map(c => `<li>${c.start}–${c.end} · <strong>${kindTag(c)}</strong> ${c.detail || c.nama || ''}</li>`).join('');
            box.innerHTML = `<div class="cbox cbox-warn"><ph-icon class="ph ph-warning-octagon"></ph-icon><div><strong>Tabrakan dengan ${data.conflicts.length} jadwal</strong><ul>${items}</ul></div></div>`;
        } else {
            box.innerHTML = `<div class="cbox cbox-ok"><ph-icon class="ph ph-check-circle"></ph-icon><div><strong>Jadwal kosong</strong>Tidak ada tabrakan di jam ini.</div></div>`;
        }
    } catch (err) {
        box.innerHTML = `<div class="cbox cbox-info"><ph-icon class="ph ph-info"></ph-icon><div>Cek tabrakan gagal — lanjut simpan, verifikasi manual di sheet.</div></div>`;
    }
}

['tanggal', 'jamStart', 'jamEnd'].forEach(id => {
    el(id).addEventListener('change', scheduleConflictCheck);
});

/* ---------- submit ---------- */
el('jobForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!PORTAL_TOKEN) {
        toast('Kamu belum login lewat portal', 'ph-warning');
        return;
    }

    const payload = {
        formType: 'other',
        token: PORTAL_TOKEN,
        jenis: currentJenis,
        subType: el('subType').value,
        detail: el('detail').value.trim(),
        lokasi: el('lokasi').value.trim(),
        tanggal: el('tanggal').value,
        jamStart: el('jamStart').value,
        jamEnd: el('jamEnd').value,
        dp: Number(el('dp').value) || 0,
        hargaTotal: Number(el('hargaTotal').value) || 0,
        status: el('status').value,
        catatan: el('catatan').value.trim()
    };

    if (!payload.tanggal || !payload.jamStart || !payload.jamEnd) {
        toast('Lengkapi tanggal & jam', 'ph-warning');
        return;
    }
    if (toMin(payload.jamEnd) <= toMin(payload.jamStart)) {
        toast('Jam selesai harus setelah jam mulai', 'ph-warning');
        return;
    }

    const btn = el('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<ph-icon class="ph ph-circle-notch"></ph-icon>Menyimpan…';

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        });

        // Verifikasi: tunggu sheet ter-update lalu reload
        await new Promise(r => setTimeout(r, 2200));
        await loadSchedule();

        const saved = allEvents.some(ev =>
            ev.source === 'other' &&
            ev.date === payload.tanggal &&
            ev.start === payload.jamStart &&
            ev.end === payload.jamEnd
        );

        if (saved) {
            toast('Job tersimpan', 'ph-check-circle');
            el('jobForm').reset();
            setJenis(currentJenis);
            el('tanggal').value = payload.tanggal;
            el('jamStart').value = '08:00';
            el('jamEnd').value = '10:00';
            el('conflictBox').innerHTML = '';
            el('status').value = 'BOOKED';
        } else {
            toast('Terkirim, tapi belum terlihat di sheet. Cek Apps Script.', 'ph-warning');
        }
    } catch (err) {
        console.error(err);
        toast('Gagal mengirim. Coba lagi.', 'ph-x-circle');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<ph-icon class="ph ph-check-square"></ph-icon>Simpan Job';
    }
});

/* ---------- init ---------- */
setJenis('Sport');
el('tanggal').value = todayISO();
loadSchedule();
setInterval(loadSchedule, 60000);
</script>
